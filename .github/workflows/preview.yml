name: Publish digest preview
run-name: Digest preview ${{ inputs.include_marker && 'with marker' || 'without marker' }}

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker; removal requires separate human approval
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export the running digest
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          PORT: 8787
        run: |
          if [ "$INCLUDE_MARKER" = true ]; then
            test -n "$LANE_MARKER"
          else
            unset LANE_MARKER
          fi
          pnpm start &
          mkdir -p "$RUNNER_TEMP/rig-preview"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/digest/2026-10-28 \
            -o "$RUNNER_TEMP/rig-preview/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload temporary Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
